name: Build Rockbox Simulators

env:
  ARTIFACT_RETENTION_DAYS: 7

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:
  push:

jobs:

  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
      hash: ${{ steps.build-info.outputs.hash }}
      date: ${{ steps.build-info.outputs.date }}
      date_display: ${{ steps.build-info.outputs.date_display }}
      skip: ${{ steps.skip-check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set targets
        id: set-targets
        run:  echo "targets=$(cat .github/targets.json | jq -c .)" >> $GITHUB_OUTPUT

      - name: Clone Rockbox
        run: git clone git://git.rockbox.org/rockbox

      - name: Get build info
        id: build-info
        run: |
          HASH=$(git -C rockbox rev-parse --short HEAD)
          DATE=$(git -C rockbox log -1 --format=%cd --date=format:'%Y%m%d-%H%M%S')
          DATE_DISPLAY=$(git -C rockbox log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "date_display=${DATE_DISPLAY}" >> $GITHUB_OUTPUT

      - name: Check if already built
        id: skip-check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HASH: ${{ steps.build-info.outputs.hash }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "Not a scheduled run, skipping release check."
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            RELEASE_NAME=$(gh release view rb-master --repo "$REPO" --json name -q '.name' 2>/dev/null || echo "")
            if [[ "$RELEASE_NAME" == *"$HASH"* ]]; then
              echo "Rockbox commit ${HASH} already released (\"${RELEASE_NAME}\"), skipping build."
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Dump available targets
        run: ./rockbox/tools/configure --type=s || true

      - name: Save Rockbox source to cache
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: rockbox/
          key: rockbox-v2-${{ steps.build-info.outputs.hash }}

  build-simulator-linux:
    runs-on: ubuntu-latest
    container: ghcr.io/adriankeenan/rockbox-build-env:latest
    if: needs.bootstrap.outputs.skip != 'true'
    needs:
      - bootstrap
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.bootstrap.outputs.targets) }}

    steps:
      - name: Restore Rockbox source
        id: restore-rockbox
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: rockbox/
          key: rockbox-v2-${{ needs.bootstrap.outputs.hash }}

      - name: Clone Rockbox (cache miss fallback)
        if: steps.restore-rockbox.outputs.cache-hit != 'true'
        run: |
          git clone git://git.rockbox.org/rockbox
          git -C rockbox checkout ${{ needs.bootstrap.outputs.hash }}

      - name: Get build info
        id: build-info
        env:
          TARGET_ID: ${{ matrix.target.id }}
          TARGET_NAME: ${{ matrix.target.name }}
          HASH: ${{ needs.bootstrap.outputs.hash }}
          DATE: ${{ needs.bootstrap.outputs.date }}
        run: |
          TARGET_SLUG=$(echo "${TARGET_NAME}" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/-\+/-/g' | tr '[:upper:]' '[:lower:]')
          echo "folder_name=rockboxui-linux-${TARGET_SLUG}-${TARGET_ID}-${DATE}-${HASH}" >> $GITHUB_OUTPUT

      - name: Configure
        env:
          TARGET_ID: ${{ matrix.target.id }}
        run: ./rockbox/tools/configure --type=s --target="${TARGET_ID}"

      - name: Build
        run: |
          make -j$(nproc)
          make fullinstall

      - name: Zip simulator
        env:
          FOLDER_NAME: ${{ steps.build-info.outputs.folder_name }}
        run: |
          zip -r "${FOLDER_NAME}.zip" rockboxui simdisk *.bmp

      - name: Upload simulator binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build-info.outputs.folder_name }}
          path: ${{ steps.build-info.outputs.folder_name }}.zip
          if-no-files-found: 'error'
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build-simulator-win32:
    runs-on: ubuntu-latest
    container: ghcr.io/adriankeenan/rockbox-build-env:latest
    if: needs.bootstrap.outputs.skip != 'true'
    needs:
      - bootstrap
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.bootstrap.outputs.targets) }}

    steps:
      - name: Restore Rockbox source
        id: restore-rockbox
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: rockbox/
          key: rockbox-v2-${{ needs.bootstrap.outputs.hash }}

      - name: Clone Rockbox (cache miss fallback)
        if: steps.restore-rockbox.outputs.cache-hit != 'true'
        run: |
          git clone git://git.rockbox.org/rockbox
          git -C rockbox checkout ${{ needs.bootstrap.outputs.hash }}

      - name: Get build info
        id: build-info
        env:
          TARGET_ID: ${{ matrix.target.id }}
          TARGET_NAME: ${{ matrix.target.name }}
          HASH: ${{ needs.bootstrap.outputs.hash }}
          DATE: ${{ needs.bootstrap.outputs.date }}
        run: |
          TARGET_SLUG=$(echo "${TARGET_NAME}" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/-\+/-/g' | tr '[:upper:]' '[:lower:]')
          echo "folder_name=rockboxui-win32-${TARGET_SLUG}-${TARGET_ID}-${DATE}-${HASH}" >> $GITHUB_OUTPUT

      - name: Configure
        env:
          TARGET_ID: ${{ matrix.target.id }}
        run: ./rockbox/tools/configure --type=aSW --target="${TARGET_ID}"

      - name: Build
        run: |
          make -j$(nproc)
          make fullinstall

      - name: Strip binary symbols
        run: |
          find -name "*rock"         -exec i686-w64-mingw32-strip "{}" ";"
          find -name "*codec"        -exec i686-w64-mingw32-strip "{}" ";"
          find -name "rockboxui.exe" -exec i686-w64-mingw32-strip "{}" ";"

      - name: Zip simulator
        env:
          FOLDER_NAME: ${{ steps.build-info.outputs.folder_name }}
        run: |
          zip -r "${FOLDER_NAME}.zip" rockboxui.exe simdisk *.bmp

      - name: Upload simulator binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build-info.outputs.folder_name }}
          path: ${{ steps.build-info.outputs.folder_name }}.zip
          if-no-files-found: 'error'
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  create-release:
    if: needs.bootstrap.outputs.skip != 'true'
    needs:
      - bootstrap
      - build-simulator-linux
      - build-simulator-win32
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download simulator artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: simulators
          pattern: '*'
          merge-multiple: true

      - name: List simulator artifacts
        run: ls -sh simulators

      - name: Delete existing release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete rb-master --yes --repo "$REPO" || true
          gh api --method DELETE /repos/$REPO/git/refs/tags/rb-master || true

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: rb-master
          name: Simulator ${{ needs.bootstrap.outputs.date_display }} ${{ needs.bootstrap.outputs.hash }}
          files: simulators/*
          body: |
            [Rockbox](https://rockbox.org) [simulator](https://www.rockbox.org/wiki/UiSimulator.html) binary builds.

            Built from commit [${{ needs.bootstrap.outputs.hash }}](https://github.com/Rockbox/rockbox/commit/${{ needs.bootstrap.outputs.hash }}) published on ${{ needs.bootstrap.outputs.date_display }}.

            See assets for simulator binaries.
          generate_release_notes: false