name: Build Rockbox Simulators

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-rb-sim-linux:
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.build-info.outputs.hash }}
      date: ${{ steps.build-info.outputs.date }}
    strategy:
      matrix:
        target:
          - name: Apple iPod Mini 2G
            id: 26
          - name: Apple iPod Classic/6G
            id: 29
          - name: Eros Q / K native
            id: 247

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl-dev

      - name: Clone Rockbox
        run: git clone git://git.rockbox.org/rockbox

      - name: Dump target IDs
        run: ./rockbox/tools/configure --type=s || true

      - name: Get build info
        id: build-info
        env:
          TARGET_ID: ${{ matrix.target.id }}
          TARGET_NAME: ${{ matrix.target.name }}
        run: |
          TARGET_SLUG=$(echo "${TARGET_NAME}" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/-\+/-/g' | tr '[:upper:]' '[:lower:]')
          HASH=$(git -C rockbox rev-parse --short HEAD)
          DATE=$(git -C rockbox log -1 --format=%cd --date=format:'%Y%m%d-%H%M%S')
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "filename=rockboxui-linux-${TARGET_SLUG}-${TARGET_ID}-${DATE}-${HASH}" >> $GITHUB_OUTPUT

      - name: Configure
        env:
          TARGET_ID: ${{ matrix.target.id }}
        run: ./rockbox/tools/configure --type=s --target="${TARGET_ID}"

      - name: Build
        run: |
          make
          make fullinstall

      - name: Rename binary
        run: mv rockboxui ${{ steps.build-info.outputs.filename }}

      - name: Upload simulator binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-info.outputs.filename }}
          path: ${{ steps.build-info.outputs.filename }}
          if-no-files-found: 'error'
          retention-days: 7

  build-sdl2-win32:
    runs-on: ubuntu-latest
    steps:
      - name: Cache SDL2
        id: cache-sdl2
        uses: actions/cache@v4
        with:
          path: ~/mingw32-sdl
          key: sdl2-mingw-w64

      - name: Install dependencies
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64

      - name: Compile SDL2
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        run: |
          wget http://www.libsdl.org/release/SDL2-2.32.8.tar.gz
          tar xvzf SDL2-2.32.8.tar.gz
          cd SDL2-2.32.8
          ./configure --host=i686-w64-mingw32 --prefix=${HOME}/mingw32-sdl
          make && make install


  build-rb-sim-win32:
    runs-on: ubuntu-latest
    needs: build-sdl2-win32
    outputs:
      hash: ${{ steps.build-info.outputs.hash }}
      date: ${{ steps.build-info.outputs.date }}
    strategy:
      matrix:
        target:
#          - name: Apple iPod Mini 2G
#            id: 26
#          - name: Apple iPod Classic/6G
#            id: 29
          - name: Eros Q / K native
            id: 247

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64

      - name: Restore SDL2 from cache
        uses: actions/cache@v4
        with:
          path: ~/mingw32-sdl
          key: sdl2-mingw-w64
          fail-on-cache-miss: true

      - name: Add SDL2 to PATH
        run: echo "${HOME}/mingw32-sdl/bin" >> $GITHUB_PATH

      - name: Clone Rockbox
        run: git clone git://git.rockbox.org/rockbox

      - name: Get build info
        id: build-info
        env:
          TARGET_ID: ${{ matrix.target.id }}
          TARGET_NAME: ${{ matrix.target.name }}
        run: |
          TARGET_SLUG=$(echo "${TARGET_NAME}" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/-\+/-/g' | tr '[:upper:]' '[:lower:]')
          HASH=$(git -C rockbox rev-parse --short HEAD)
          DATE=$(git -C rockbox log -1 --format=%cd --date=format:'%Y%m%d-%H%M%S')
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "filename=rockboxui-win32-${TARGET_SLUG}-${TARGET_ID}-${DATE}-${HASH}.exe" >> $GITHUB_OUTPUT

      - name: Configure
        env:
          TARGET_ID: ${{ matrix.target.id }}
        run: ./rockbox/tools/configure --type=aSW --target="${TARGET_ID}"

      - name: Build
        run: make && make install

      - name: ls
        run: ls -lash

      - name: Rename binary
        run: mv rockboxui.exe ${{ steps.build-info.outputs.filename }}

      - name: Upload simulator binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-info.outputs.filename }}
          path: ${{ steps.build-info.outputs.filename }}
          if-no-files-found: 'error'
          retention-days: 7

  create-release:
    needs:
     - build-rb-sim-linux
     - build-rb-sim-win32
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2.5.0
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: rb-${{ needs.build-rb-sim-linux.outputs.hash }}
          name: rockbox simulator ${{ needs.build-rb-sim-linux.outputs.date }} ${{ needs.build-rb-sim-linux.outputs.hash }}
          files: artifacts/*/*
          body: |
            [Rockbox](https://rockbox.org) [simulator](https://www.rockbox.org/wiki/UiSimulator.html) builds for linux.

            Built from commit [${{ needs.build-rb-sim-linux.outputs.hash }}](https://github.com/Rockbox/rockbox/commit/${{ needs.build-rb-sim-linux.outputs.hash }}) published on ${{ needs.build-rb-sim-linux.outputs.date }}.

            See assets for simulator binaries.
          generate_release_notes: false