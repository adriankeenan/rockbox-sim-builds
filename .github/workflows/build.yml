name: Build Rockbox Simulators

env:
  ARTIFACT_RETENTION_DAYS: 7

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:
  push:

jobs:

  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
      hash: ${{ steps.build-info.outputs.hash }}
      date: ${{ steps.build-info.outputs.date }}
      date_display: ${{ steps.build-info.outputs.date_display }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set targets
        id: set-targets
        run:  echo "targets=$(cat .github/targets.json | jq -c .)" >> $GITHUB_OUTPUT

      - name: Clone Rockbox
        run: git clone git://git.rockbox.org/rockbox

      - name: Get build info
        id: build-info
        run: |
          HASH=$(git -C rockbox rev-parse --short HEAD)
          DATE=$(git -C rockbox log -1 --format=%cd --date=format:'%Y%m%d-%H%M%S')
          DATE_DISPLAY=$(git -C rockbox log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "date_display=${DATE_DISPLAY}" >> $GITHUB_OUTPUT

      - name: Dump available targets
        run: ./rockbox/tools/configure --type=s || true

  build-sdl2-win32:
    runs-on: ubuntu-latest
    steps:
      - name: Cache SDL2
        id: cache-sdl2
        uses: actions/cache@v4
        with:
          path: ~/mingw32-sdl
          key: sdl2-mingw-w64

      - name: Install dependencies
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64

      - name: Compile SDL2
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        run: |
          wget https://www.libsdl.org/release/SDL2-2.32.8.tar.gz
          tar xvzf SDL2-2.32.8.tar.gz
          cd SDL2-2.32.8
          ./configure --host=i686-w64-mingw32 --prefix=${HOME}/mingw32-sdl
          make && make install

  build-simulator-linux:
    runs-on: ubuntu-latest
    needs:
      - bootstrap
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.bootstrap.outputs.targets) }}

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl-dev

      - name: Clone Rockbox
        run: |
          git clone git://git.rockbox.org/rockbox
          git -C rockbox checkout ${{ needs.bootstrap.outputs.hash }}

      - name: Get build info
        id: build-info
        env:
          TARGET_ID: ${{ matrix.target.id }}
          TARGET_NAME: ${{ matrix.target.name }}
          HASH: ${{ needs.bootstrap.outputs.hash }}
          DATE: ${{ needs.bootstrap.outputs.date }}
        run: |
          TARGET_SLUG=$(echo "${TARGET_NAME}" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/-\+/-/g' | tr '[:upper:]' '[:lower:]')
          echo "folder_name=rockboxui-linux-${TARGET_SLUG}-${TARGET_ID}-${DATE}-${HASH}" >> $GITHUB_OUTPUT

      - name: Configure
        env:
          TARGET_ID: ${{ matrix.target.id }}
        run: ./rockbox/tools/configure --type=s --target="${TARGET_ID}"

      - name: Build
        run: |
          make
          make fullinstall

      - name: Zip simulator
        env:
          FOLDER_NAME: ${{ steps.build-info.outputs.folder_name }}
        run: |
          zip -r "${FOLDER_NAME}.zip" rockboxui simdisk *.bmp

      - name: Upload simulator binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-info.outputs.folder_name }}
          path: ${{ steps.build-info.outputs.folder_name }}.zip
          if-no-files-found: 'error'
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build-simulator-win32:
    runs-on: ubuntu-latest
    needs:
      - bootstrap
      - build-sdl2-win32
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.bootstrap.outputs.targets) }}

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64

      - name: Restore SDL2 from cache
        uses: actions/cache@v4
        with:
          path: ~/mingw32-sdl
          key: sdl2-mingw-w64
          fail-on-cache-miss: true

      - name: Add SDL2 to PATH
        run: echo "${HOME}/mingw32-sdl/bin" >> $GITHUB_PATH

      - name: Clone Rockbox
        run: |
          git clone git://git.rockbox.org/rockbox
          git -C rockbox checkout ${{ needs.bootstrap.outputs.hash }}

      - name: Get build info
        id: build-info
        env:
          TARGET_ID: ${{ matrix.target.id }}
          TARGET_NAME: ${{ matrix.target.name }}
          HASH: ${{ needs.bootstrap.outputs.hash }}
          DATE: ${{ needs.bootstrap.outputs.date }}
        run: |
          TARGET_SLUG=$(echo "${TARGET_NAME}" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/-\+/-/g' | tr '[:upper:]' '[:lower:]')
          echo "folder_name=rockboxui-win32-${TARGET_SLUG}-${TARGET_ID}-${DATE}-${HASH}" >> $GITHUB_OUTPUT

      - name: Configure
        env:
          TARGET_ID: ${{ matrix.target.id }}
        run: ./rockbox/tools/configure --type=aSW --target="${TARGET_ID}"

      - name: Build
        run: |
          make
          make fullinstall

      - name: Strip binary symbols
        run: |
          find -name "*rock"         -exec i686-w64-mingw32-strip "{}" ";"
          find -name "*codec"        -exec i686-w64-mingw32-strip "{}" ";"
          find -name "rockboxui.exe" -exec i686-w64-mingw32-strip "{}" ";"

      - name: Zip simulator
        env:
          FOLDER_NAME: ${{ steps.build-info.outputs.folder_name }}
        run: |
          zip -r "${FOLDER_NAME}.zip" rockboxui.exe simdisk *.bmp

      - name: Upload simulator binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-info.outputs.folder_name }}
          path: ${{ steps.build-info.outputs.folder_name }}.zip
          if-no-files-found: 'error'
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build-simulator-macos:
    runs-on: ubuntu-latest
    needs:
      - bootstrap
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.bootstrap.outputs.targets) }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake patch libxml2-dev libssl-dev zlib1g-dev libbz2-dev libicu-dev
          # Osxcross for cross-compiling to macOS
          git clone https://github.com/tpoechtrager/osxcross
          cd osxcross
          wget -nc https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz
          mv MacOSX11.3.sdk.tar.xz tarballs/
          UNATTENDED=1 ./build.sh
          echo "$(pwd)/target/bin" >> $GITHUB_PATH

      - name: Clone Rockbox
        run: |
          git clone git://git.rockbox.org/rockbox
          git -C rockbox checkout ${{ needs.bootstrap.outputs.hash }}

      - name: Get build info
        id: build-info
        env:
          TARGET_ID: ${{ matrix.target.id }}
          TARGET_NAME: ${{ matrix.target.name }}
          HASH: ${{ needs.bootstrap.outputs.hash }}
          DATE: ${{ needs.bootstrap.outputs.date }}
        run: |
          TARGET_SLUG=$(echo "${TARGET_NAME}" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/-\+/-/g' | tr '[:upper:]' '[:lower:]')
          echo "folder_name=rockboxui-macos-${TARGET_SLUG}-${TARGET_ID}-${DATE}-${HASH}" >> $GITHUB_OUTPUT

      - name: Configure
        env:
          TARGET_ID: ${{ matrix.target.id }}
          CROSS_COMPILE: x86_64-apple-darwin20.4-
        run: |
          export PATH=$PATH:$(pwd)/osxcross/target/bin
          # We need a way to tell configure we are cross-compiling for Darwin.
          # The configure script uses 'uname' usually, but we can try setting CROSS_COMPILE
          # and manually overriding uname or using the provided flags if any.
          # Since Rockbox configure doesn't have a --macos-cross flag, we might need 
          # to trick it or use a specific environment.
          ./rockbox/tools/configure --type=s --target="${TARGET_ID}" --compiler-prefix="x86_64-apple-darwin20.4-"

      - name: Build
        run: |
          export PATH=$PATH:$(pwd)/osxcross/target/bin
          make
          make fullinstall

      - name: Zip simulator
        env:
          FOLDER_NAME: ${{ steps.build-info.outputs.folder_name }}
        run: |
          zip -r "${FOLDER_NAME}.zip" rockboxui simdisk *.bmp

      - name: Upload simulator binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-info.outputs.folder_name }}
          path: ${{ steps.build-info.outputs.folder_name }}.zip
          if-no-files-found: 'error'
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  create-release:
    needs:
      - bootstrap
      - build-simulator-linux
      - build-simulator-win32
      - build-simulator-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download simulator artifacts
        uses: actions/download-artifact@v4
        with:
          path: simulators
          pattern: '*'
          merge-multiple: true

      - name: List simulator artifacts
        run: ls -sh simulators

      - name: Delete existing release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete rb-master --yes --repo "$REPO" || true
          gh api --method DELETE /repos/$REPO/git/refs/tags/rb-master || true

      - name: Create release
        uses: softprops/action-gh-release@v2.5.0
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: rb-master
          name: Simulator ${{ needs.bootstrap.outputs.date_display }} ${{ needs.bootstrap.outputs.hash }}
          files: simulators/*
          body: |
            [Rockbox](https://rockbox.org) [simulator](https://www.rockbox.org/wiki/UiSimulator.html) binary builds.

            Built from commit [${{ needs.bootstrap.outputs.hash }}](https://github.com/Rockbox/rockbox/commit/${{ needs.bootstrap.outputs.hash }}) published on ${{ needs.bootstrap.outputs.date_display }}.

            See assets for simulator binaries.
          generate_release_notes: false